# Fork baseline build: verify the fork builds on Windows / macOS / Linux.
#
# Notes:
# - Builds are UNSIGNED (no Apple Developer certificate / Windows code
#   signing configured yet). macOS users will need to allow the app
#   manually on first launch; Windows may show a SmartScreen prompt.
# - Linux uses libwebkit2gtk-4.1-dev, matching upstream's wails v2.12
#   bump (2026-07 commit "use webkit2gtk-4.1 on Arch").
# - Artifacts are uploaded per run; cutting a GitHub Release from them
#   is still a manual step (see TODO in the fork maintenance plan).
#
# Triggered on pushes to the baseline branch, on pull requests, and
# manually via workflow_dispatch.

name: Build

on:
  push:
    branches: [chore/fork-baseline]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
            artifact: res-downloader-linux
          - os: windows-latest
            platform: windows/amd64
            artifact: res-downloader-windows
          - os: macos-latest
            platform: darwin/universal
            artifact: res-downloader-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Build app
        run: wails build -platform ${{ matrix.platform }} -o ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/bin/
