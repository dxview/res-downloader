# Fork baseline build: verify the fork builds on Windows / macOS / Linux.
#
# Notes:
# - Builds are UNSIGNED (no Apple Developer certificate / Windows code
#   signing configured yet). macOS users will need to allow the app
#   manually on first launch; Windows may show a SmartScreen prompt.
# - Linux pins ubuntu-22.04 with libwebkit2gtk-4.0-dev: Wails v2.12's
#   Linux cgo build links webkit2gtk-4.0, which ubuntu-latest (24.04) no
#   longer ships (it only has 4.1). The earlier 4.1 install failed the
#   Linux job with "Package webkit2gtk-4.0 was not found".
# - Artifacts are uploaded per run; cutting a GitHub Release from them
#   is still a manual step (see TODO in the fork maintenance plan).
#
# Triggered on pushes to any branch, on pull requests, and manually via
# workflow_dispatch (self-use fork: every branch push gets a build).

name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux/amd64
            artifact: res-downloader-linux
          - os: windows-latest
            platform: windows/amd64
            artifact: res-downloader-windows
          - os: macos-latest
            platform: darwin/universal
            artifact: res-downloader-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Build app
        run: wails build -platform ${{ matrix.platform }} -o ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/bin/
